<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Stylized QR Corner Targets -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left QR target -->
    <rect x="72" y="72" width="96" height="96" rx="18" />
    <rect x="94" y="94" width="52" height="52" rx="10" fill="url(#goldGrad)" />

    <!-- Top-Right QR target -->
    <rect x="344" y="72" width="96" height="96" rx="18" />
    <rect x="366" y="94" width="52" height="52" rx="10" fill="url(#goldGrad)" />

    <!-- Bottom-Left QR target -->
    <rect x="72" y="344" width="96" height="96" rx="18" />
    <rect x="94" y="366" width="52" height="52" rx="10" fill="url(#goldGrad)" />
  </g>

  <!-- Central Emblem: Sprout & Farm Field Sun -->
  <!-- Sun Glow -->
  <circle cx="256" cy="230" r="64" fill="url(#goldGrad)" fill-opacity="0.25" />
  <circle cx="256" cy="230" r="44" fill="url(#goldGrad)" />

  <!-- Farm Furrow Arcs -->
  <path d="M190 380 Q 256 340 322 380" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" />
  <path d="M210 405 Q 256 375 302 405" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Plant Sprout -->
  <path d="M256 340 C 256 270 200 240 180 200 C 240 205 256 260 256 340 Z" fill="url(#leafGrad)" />
  <path d="M256 340 C 256 260 310 225 332 180 C 330 245 285 275 256 340 Z" fill="url(#leafGrad)" />
  
  <!-- Central Stem -->
  <path d="M256 350 L256 230" stroke="#047857" stroke-width="6" stroke-linecap="round" />

  <!-- QR decorative pixel dots in bottom right -->
  <g fill="#34d399" opacity="0.9">
    <rect x="344" y="344" width="26" height="26" rx="6" />
    <rect x="380" y="344" width="26" height="26" rx="6" />
    <rect x="414" y="344" width="26" height="26" rx="6" />
    <rect x="344" y="380" width="26" height="26" rx="6" />
    <rect x="414" y="380" width="26" height="26" rx="6" />
    <rect x="380" y="414" width="26" height="26" rx="6" />
    <rect x="414" y="414" width="26" height="26" rx="6" />
  </g>
</svg>
